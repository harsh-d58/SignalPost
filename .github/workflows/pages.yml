name: showcase-pages
# Publishes the fresh, explicitly limited 1,000-profile public sample.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["reports/public-sample-*", "src/signalpost/showcase/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: is GitHub Pages enabled for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (Settings -> Pages -> Source: GitHub Actions); the site is built but not deployed."
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: build the site from the committed envelopes (no network)
        run: |
          mkdir -p run
          gunzip -c reports/public-sample-20261114.jsonl.gz > run/envelopes.jsonl
          uv run signalpost showcase --envelopes run/envelopes.jsonl --report reports/public-sample-20261114-report.json --output _site
          test -f _site/index.html && test "$(ls _site/data | wc -l)" -eq 1000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    # pushes deploy only once Pages is enabled; a manual "Run workflow" always deploys (also the very first time)
    if: needs.build.outputs.pages == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
