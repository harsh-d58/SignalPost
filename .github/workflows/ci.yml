name: clean-machine
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --group dev pytest tests eval/diagnostics -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: frontend publication and resilience regressions
        run: |
          npm install --no-save --package-lock=false jsdom@24.1.3
          node --test eval/ui_resilience_check.cjs
      - name: live smoke (5 companies)
        run: |
          printf '{"organisation_number":"923609016"}\n{"organisation_number":"947942638"}\n{"organisation_number":"996756246"}\n{"organisation_number":"914778271"}\n{"organisation_number":"000000000"}\n' > ci-batch.jsonl
          uv run signalpost run --organisations ci-batch.jsonl --out out-ci --job-days 2
          test "$(wc -l < out-ci/envelopes.jsonl)" -eq 5
          uv run python eval/snapshot_audit.py out-ci
